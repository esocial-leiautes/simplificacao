name: Publish GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Encontrar versão mais recente
        shell: bash
        run: |
          latest=$(find . -maxdepth 1 -type d -name "v_S_*" \
            | sed 's|^\./||' \
            | sort -V \
            | tail -n 1)

          echo "Última versão: $latest"

          mkdir site

          # Copia todo o conteúdo do repositório para a pasta de publicação
          shopt -s dotglob
          cp -R * site/

          # Gera o index.html que redireciona para a versão mais recente
          cat > site/index.html <<EOF
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=$latest/doc/saida/">
            <title>Leiautes eSocial Simplificação</title>
            <script>
              location.replace("./$latest/doc/saida/");
            </script>
          </head>
          <body>
            <p>Redirecionando para <a href="./$latest/doc/saida/">$latest</a>...</p>
          </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
